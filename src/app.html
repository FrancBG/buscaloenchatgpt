<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/google.svg" />
		<meta name="viewport" content="width=device-width" />

		<meta name="keywords" content="ChatGPT, meme, LMGTFY, humor" />

		<meta property="og:title" content="BuscaLoEnChatGPT" />
		<meta
			property="og:description"
			content="Parodia tipo LMGTFY para compartir y acabar en ChatGPT."
		/>

		<!-- Prevents the white flash on page load -->
		<script>
			const brightness = localStorage.getItem('brightness')

			if (brightness === 'light') document.documentElement.classList.remove('dark')
			else if (brightness === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches)
				document.documentElement.classList.add('dark')
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-meme-surface dark:bg-memeDark-surface">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
