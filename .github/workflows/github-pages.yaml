name: GitHub Pages

on:
  push:
    branches: main

# Solo un despliegue Pages a la vez
concurrency:
  group: pages
  cancel-in-progress: false

# pnpm/action-setup@v4 aún corre sobre Node 20 hasta el cambio por defecto en Actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    if: ${{ github.actor != 'nektos/act' }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      # Dominio propio (buscaloenchatgpt.com): variable repo PAGES_USE_ROOT_BASE=true → BUILD_BASE vacío.
      # Sin variable (o distinto de "true"): BUILD_BASE=/buscaloenchatgpt → https://francbg.github.io/buscaloenchatgpt/
      - name: Configure SvelteKit base for Pages
        run: |
          ROOT="${{ vars.PAGES_USE_ROOT_BASE }}"
          if [ "$ROOT" = "true" ]; then
            echo "BUILD_BASE=" >> "$GITHUB_ENV"
            echo "Using empty base (custom domain at site root)"
          else
            echo "BUILD_BASE=/buscaloenchatgpt" >> "$GITHUB_ENV"
            echo "Using project Pages base /buscaloenchatgpt"
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
